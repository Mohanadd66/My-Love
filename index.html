<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Love Story ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&amp;family=Great+Vibes&amp;family=Montserrat:wght@300;500&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#0d0408;--gold:#d8b26e;--gold2:#f3dcaa;--ink:#f8ece4;--rose:#c2415f;--bar:clamp(46px,10vh,84px);box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0408;overflow:hidden}
*{box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;font-weight:300;color:var(--ink);text-align:center;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3a1424,#0d0408 75%)}
.bg{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s}
.bg.in{opacity:1}.kb{animation:kb 16s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.18) translate(-2%,-2%)}}
.art{background:radial-gradient(circle at 30% 30%,rgba(194,65,95,.55),transparent 55%),radial-gradient(circle at 75% 70%,rgba(216,178,110,.35),transparent 50%),linear-gradient(160deg,#2a0f1b,#0d0408)}
.art.a1{background:radial-gradient(circle at 70% 25%,rgba(216,178,110,.4),transparent 55%),radial-gradient(circle at 25% 75%,rgba(194,65,95,.5),transparent 55%),linear-gradient(200deg,#3a1424,#0d0408)}
.art.a2{background:radial-gradient(circle at 50% 50%,rgba(194,65,95,.5),transparent 60%),linear-gradient(120deg,#1d0a12,#3a1424)}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,4,8,.55),rgba(13,4,8,.25) 40%,rgba(13,4,8,.75))}
#bk{position:absolute;inset:0;mix-blend-mode:screen}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75));pointer-events:none}
.leak{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,170,90,.18) 48%,transparent 62%);mix-blend-mode:screen;animation:lk 9s ease-in-out infinite;pointer-events:none}
@keyframes lk{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
.grain{position:absolute;inset:-50%;opacity:.09;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .6s steps(4) infinite}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.box{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:5}
.top{top:0}.bot{bottom:0}
#prog{position:absolute;left:14px;right:14px;bottom:10px;display:flex;gap:4px}
#prog i{flex:1;height:2px;background:rgba(216,178,110,.25);position:relative;overflow:hidden}
#prog i b{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.ib{position:absolute;top:50%;transform:translateY(-50%);border:1px solid rgba(216,178,110,.5);background:none;color:var(--gold2);cursor:pointer;font:inherit;font-size:12px;display:none}
#mute{right:12px;width:34px;height:34px;border-radius:50%}
#edbtn{left:12px;padding:7px 14px;border-radius:20px}
#sc{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--bar);display:flex;padding:20px 28px;z-index:3;transition:opacity .8s;overflow-y:auto}
#sc.out{opacity:0}
.txt{max-width:640px;width:100%;margin:auto}
.ln{opacity:0;transform:translateY(16px);filter:blur(8px);animation:rv 1.8s ease forwards}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
.k{letter-spacing:.5em;font-size:11px;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(36px,9vw,68px);line-height:1.1;margin:0 0 18px;color:var(--gold2);text-shadow:0 4px 30px rgba(0,0,0,.6)}
.s{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,5vw,28px);line-height:1.6;margin:10px 0;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.script{font-family:'Great Vibes',cursive;font-weight:400;color:var(--gold2)}
.big{font-size:clamp(64px,19vw,140px);line-height:1;margin:6px 0;text-shadow:0 0 50px rgba(216,178,110,.4)}
.line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}
.btn{font:inherit;font-weight:500;letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:#2a0f1b;background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;border-radius:40px;padding:16px 42px;cursor:pointer;margin-top:30px;box-shadow:0 0 40px rgba(216,178,110,.35)}
.hint{position:absolute;left:0;right:0;bottom:calc(var(--bar) + 12px);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(216,178,110,.55);z-index:4;pointer-events:none}
#flame{cursor:pointer;transform-origin:50% 100%;animation:fl 1s infinite alternate;transition:opacity .7s}
@keyframes fl{to{transform:scale(1.1,.92) rotate(2deg)}}
.roll{animation:roll 26s linear forwards}
@keyframes roll{from{transform:translateY(60vh)}to{transform:translateY(-70vh)}}
.cr{margin:0 0 26px;font-size:15px}.cr small{display:block;letter-spacing:.35em;font-size:10px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.env{position:relative;width:300px;height:200px;margin:18px auto;background:#800020;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.6);cursor:pointer;transition:transform .9s,opacity .9s;animation:fl2 2.4s ease-in-out infinite alternate}
@keyframes fl2{to{transform:translateY(-8px)}}
.env .fl{position:absolute;top:0;left:0;right:0;border-left:150px solid transparent;border-right:150px solid transparent;border-top:110px solid #a30e33;transform-origin:top;transition:transform .7s,z-index .3s;z-index:3}
.env .pk{position:absolute;bottom:0;left:0;right:0;border-left:150px solid #63031a;border-right:150px solid #63031a;border-bottom:100px solid #750621;border-radius:0 0 12px 12px;z-index:2}
.env .sl{position:absolute;top:84px;left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3dcaa,#b98a3e);z-index:4;display:flex;align-items:center;justify-content:center;color:#7a1f38;font-size:18px;transition:opacity .4s}
.env .lt{position:absolute;bottom:10px;left:20px;right:20px;height:150px;background:#fff0f3;border-radius:8px;z-index:1;transition:transform .8s .3s}
.env.open{animation:none;cursor:default}.env.open .fl{transform:rotateX(180deg);z-index:1}.env.open .sl{opacity:0}.env.open .lt{transform:translateY(-90px)}
.env.gone{opacity:0;transform:scale(.8) translateY(30px);pointer-events:none}
.paper{display:none;background:#fff0f3;color:#3a1220;border-radius:14px;padding:26px 24px;max-width:520px;width:100%;margin:0 auto;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:'Cormorant Garamond',serif;font-size:clamp(19px,4.6vw,23px);line-height:1.8}
.paper p{margin:0 0 12px}.paper .btn{margin:10px auto 0;display:block}
.frm{width:min(210px,52vw,30vh);background:#f8ece4;padding:8px 8px 28px;border-radius:3px;box-shadow:0 18px 45px rgba(0,0,0,.65);transform:rotate(-3deg);margin:0 auto 22px;position:relative}
.frm::after{content:'\2665';position:absolute;bottom:5px;left:0;right:0;color:#c2415f;font-size:15px}
.frm img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#edm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:flex-start;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow-y:auto}
#edm .p{background:#1b0b12;border:1px solid rgba(216,178,110,.4);border-radius:16px;padding:18px;max-width:560px;width:100%;text-align:left;font-size:13px}
#edm h3{font-family:'Cormorant Garamond',serif;color:var(--gold2);font-size:22px;margin:0 0 4px}
#edm h4{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:11px;margin:20px 0 6px;border-top:1px solid rgba(216,178,110,.2);padding-top:14px}
#edm label{display:block;color:#bfa59b;margin-top:8px;font-size:12px}
#edm input[type=text],#edm textarea{width:100%;background:#2a1520;border:1px solid #4a2a38;border-radius:8px;color:#fff;padding:8px;font:inherit;margin-top:3px}
#edm input[type=file]{margin-top:4px;color:#bfa59b;max-width:100%}
#edm .row{display:flex;gap:8px;margin-top:18px}#edm .row button{flex:1;margin:0;padding:13px}
</style>
</head>
<body>
<div id="stage">
  <div id="bgwrap"></div><div class="dim"></div><canvas id="bk"></canvas><div class="leak"></div><div class="vig"></div><div class="grain"></div>
  <div class="box top"><button class="ib" id="edbtn" onclick="openEd()">✏️ Edit</button><button class="ib" id="mute" onclick="toggleMute()">♪</button></div>
  <div class="box bot"><div id="prog"></div></div>
  <div id="sc" class=""></div>
  <div class="hint" id="hint"></div>
</div>

<script>
const C=JSON.parse(document.getElementById('cfg').textContent);
C.envelope=C.envelope||{k:'One more thing',h:'Tap the envelope to open it',msg:'To my love,\n\nI wrote this just for you, to read on your own, in your own time.\n\nYou make every ordinary day feel special. Thank you for being you, and for letting me love you.\n\nHappy birthday, my heart.',btn:'Continue ♡'};
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S=[{poster:1},...C.scenes,{env:1},{wish:1},{credits:1}];
S.forEach(s=>{if(s.l)s.dur=Math.max(7,2+s.l.length*2.3+(s.t?1:0)+(s.img?2:0))*1000});
const real=S.filter(s=>!s.poster);
$('prog').innerHTML=real.map(()=>'<i><b></b></i>').join('');
let idx=-1,T,started=false;
function bgFor(s,p){const w=$('bgwrap');w.innerHTML='';const d=document.createElement('div'),src='';
 if(src){d.className='bg kb';d.style.backgroundImage=`url(${src})`}else d.className='bg art a'+(p%3);
 w.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')))}
function build(s){
 const D=(n)=>`style="animation-delay:${n}s"`;
 if(s.poster)return `<div class="txt"><p class="k ln" ${D(.5)}>${e(C.poster.k)}</p><h1 class="script big ln" style="animation-delay:1.2s;margin:0">${e(C.her)}</h1><div class="line ln" ${D(2)}></div><p class="s ln" ${D(2.4)}>${e(C.poster.sub)}</p><button class="btn ln" ${D(3.2)} onclick="begin()">${e(C.poster.btn)}</button></div>`;
 if(s.env)return `<div class="txt"><div id="envtop"><p class="k ln" ${D(.4)}>${e(C.envelope.k)}</p><div class="ln" ${D(1)}><div class="env" id="envl" onclick="openEnv()"><div class="pk"></div><div class="lt"></div><div class="fl"></div><div class="sl">♥</div></div></div><p class="s ln" style="animation-delay:1.8s;font-size:18px;color:#bfa59b">${e(C.envelope.h)}</p></div><div class="paper" id="paper">${C.envelope.msg.split('\n').filter(x=>x.trim()).map((x,j)=>`<p class="ln" style="animation-delay:${.4+j*1}s">${e(x)}</p>`).join('')}<button class="btn ln" style="animation-delay:${.6+C.envelope.msg.split('\n').filter(x=>x.trim()).length}s" onclick="play(idx+1)">${e(C.envelope.btn)}</button></div></div>`;
 if(s.wish)return `<div class="txt" id="wishbox"><p class="k ln" ${D(.4)}>${e(C.wish.k)}</p><h2 class="ln" ${D(1)}>${e(C.wish.t)}</h2><svg width="190" height="190" viewBox="0 0 190 200" class="ln" ${D(1.8)}><ellipse cx="95" cy="180" rx="85" ry="11" fill="#000" opacity=".4"/><rect x="25" y="108" width="140" height="70" rx="10" fill="#7a1f38"/><path d="M25 121q17 16 35 0t35 0 35 0 35 0v-8a10 10 0 0 0-10-10H35a10 10 0 0 0-10 10z" fill="#f3dcaa"/><rect x="90" y="64" width="10" height="42" fill="#f8ece4"/><g id="flame" onclick="blow()"><circle cx="95" cy="44" r="38" fill="#ffb43a" opacity=".18"/><path d="M95 22c14 16 12 30 0 38-12-8-14-22 0-38z" fill="#ffb43a"/><path d="M95 36c7 8 6 15 0 19-6-4-7-11 0-19z" fill="#fff3b0"/></g></svg><p class="s ln" style="animation-delay:2.8s;font-size:18px;color:#bfa59b">${e(C.wish.h)}</p></div>`;
 if(s.credits)return `<div class="txt" style="height:100%;position:relative;overflow:hidden"><div class="roll" style="position:absolute;left:0;right:0"><h2 class="script big" style="margin-bottom:40px">${e(C.credits.title)}</h2>${C.credits.rows.map(r=>`<div class="cr"><small>${e(r[0])}</small>${e(r[1])}</div>`).join('')}<p class="script" style="font-size:44px;margin-top:50px">${e(C.me)}</p><p class="s" style="margin-top:30px">${e(C.credits.end)}</p></div></div>`;
 return `<div class="txt">${s.img?`<div class="frm ln" style="animation-delay:.3s"><img src="${s.img}" alt=""></div>`:''}${s.k?`<p class="k ln" ${D(.6)}>${e(s.k)}</p>`:''}${s.t?`<h2 class="ln" ${D(1.2)}>${e(s.t)}</h2>`:''}${s.l.map((x,j)=>`<p class="s ln" style="animation-delay:${(s.t?2:.8)+j*2.3}s">${e(x)}</p>`).join('')}</div>`;
}
function play(i){
 clearTimeout(T);if(i>=S.length)return;const sc=$('sc'),s=S[i];sc.classList.add('out');
 setTimeout(()=>{idx=i;bgFor(s,s.p!==undefined?s.p:s.wish?1:2);
  sc.innerHTML=build(s);sc.classList.remove('out');sc.scrollTop=0;
  const ri=i-1;[...$('prog').children].forEach((el,k)=>{const b=el.firstChild;b.style.transition='none';b.style.transform=k<ri?'scaleX(1)':'scaleX(0)';if(k===ri&&s.dur)requestAnimationFrame(()=>{b.style.transition=`transform ${s.dur}ms linear`;b.style.transform='scaleX(1)'})});
  $('hint').textContent=(started&&s.dur)?'tap to skip':'';
  if(s.dur)T=setTimeout(()=>play(i+1),s.dur);
 },i===0?0:800);
}
function begin(){if(started)return;started=true;startMusic();$('mute').style.display='block';play(1)}
$('stage').addEventListener('click',ev=>{if(!started||ev.target.closest('button,#flame'))return;const s=S[idx];if(s&&s.dur)play(idx+1)});
function openEnv(){const en=$('envl');if(en.classList.contains('open'))return;en.classList.add('open');boom(60);setTimeout(()=>{en.classList.add('gone');setTimeout(()=>{$('envtop').style.display='none';$('paper').style.display='block';$('sc').scrollTop=0},800)},1500)}
function boom(n=120){try{confetti({particleCount:n,spread:100,origin:{y:.6},colors:['#d8b26e','#f3dcaa','#c2415f','#ffffff']})}catch(x){}}
function blow(){$('flame').style.opacity=0;boom(180);setTimeout(()=>{boom(140);$('wishbox').innerHTML=`<h1 class="script big ln">${e(C.wish.f1)}</h1><div class="line ln" style="animation-delay:.8s"></div><p class="s ln" style="animation-delay:1.4s;font-size:26px">${e(C.wish.f2)}</p>`;$('hint').textContent='';T=setTimeout(()=>play(S.length-1),7000)},900)}

// bokeh
const cv=$('bk'),cx=cv.getContext('2d');let W,H,B=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;B=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,r:14+Math.random()*50,v:.12+Math.random()*.35,a:.08+Math.random()*.16,c:Math.random()>.5?'216,178,110':'194,65,95',p:Math.random()*6}))}
rs();addEventListener('resize',rs);
(function f(t){cx.clearRect(0,0,W,H);B.forEach(b=>{b.y-=b.v;b.x+=Math.sin(t/3000+b.p)*.25;if(b.y<-b.r)b.y=H+b.r;const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r),a=b.a*(.6+.4*Math.sin(t/1500+b.p));g.addColorStop(0,`rgba(${b.c},${a})`);g.addColorStop(.7,`rgba(${b.c},${a*.5})`);g.addColorStop(1,`rgba(${b.c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill()});requestAnimationFrame(f)})(0);

// ===== music: your own song if uploaded, otherwise a soft piano ballad =====
let ac,master,au,muted=false;const m2f=m=>440*2**((m-69)/12);
const CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],BS=[45,41,48,43];
const MEL=[76,0,0,0,72,0,74,0, 72,0,0,0,69,0,72,0, 76,0,0,79,0,76,0,0, 74,0,0,0,71,0,74,0];
function piano(m,t,v,dur){[[1,1],[2,.35],[3,.12],[4,.05]].forEach(h=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=m2f(m)*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*h[1],t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur/h[0]**.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)})}
function pad(m,t,v,dur){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=m2f(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+1.8);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)}
function startMusic(){
 if(C.music){try{au=new Audio(C.music);au.loop=true;au.volume=.85;au.play();return}catch(x){}}
 try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;
 const len=ac.sampleRate*3,ir=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
 const cv2=ac.createConvolver();cv2.buffer=ir;const wet=ac.createGain();wet.gain.value=.55;master.connect(ac.destination);master.connect(cv2);cv2.connect(wet);wet.connect(ac.destination);
 let step=0,next=ac.currentTime+.3;const SP=.62;
 setInterval(()=>{while(next<ac.currentTime+.8){const b=Math.floor(step/8)%4,i=step%8,ch=CH[b];
  if(i===0){piano(BS[b],next,.16,4.5);ch.forEach(n=>pad(n-12,next,.03,SP*8))}
  piano(ch[[0,1,2,1,2,1,2,1][i]]+(i%2?0:12),next,.05,2.2);
  const me=MEL[step%32];if(me)piano(me,next,.11,2.6);
  step++;next+=SP}},150)}catch(x){}}
function toggleMute(){muted=!muted;if(au)au.muted=muted;if(master)master.gain.value=muted?0:.7;$('mute').style.opacity=muted?.4:1}

// ===== owner-only editor =====
let ART=null;
(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),a=await claude.use('artifact');if(u&&a&&u.isOwner()){ART=a;$('edbtn').style.display='block'}}catch(x){}})();
function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.82))};im.src=u})}
function rdAudio(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
const NAMES=['Opening','Birthday scene','The beginning','The moment I knew','Why I love you (reasons)','The letter'];
let FL=[];
function openEd(){
 FL=[];let h='';
 const tx=(lbl,get,set,ta)=>{FL.push({get,set});const i=FL.length-1;return `<label>${e(lbl)}${ta?`<textarea rows="${ta}" data-i="${i}">${e(get())}</textarea>`:`<input type="text" data-i="${i}" value="${e(get())}">`}</label>`};
 const lines=a=>({get:()=>a.join('\n'),set:v=>v.split('\n').map(x=>x.trim()).filter(Boolean)});
 h+='<h4>Names</h4>'+tx('Her name (title)',()=>C.her,v=>C.her=v)+tx('Your signature',()=>C.me,v=>C.me=v);
 h+='<h4>Poster</h4>'+['k','sub','btn'].map((k,j)=>tx(['Small line','Subtitle','Button text'][j],()=>C.poster[k],v=>C.poster[k]=v)).join('');
 C.scenes.forEach((s,n)=>{h+=`<h4>${NAMES[n]||'Scene '+(n+1)}</h4>`;if(s.k!==undefined)h+=tx('Small label',()=>s.k,v=>s.k=v);if(s.t!==undefined)h+=tx('Title',()=>s.t,v=>s.t=v);h+=`<label>Photo for this scene ${s.img?'✓ added':'(none)'}<input type="file" accept="image/*" id="scimg${n}"></label><label><input type="checkbox" id="scimgclr${n}"> Remove this photo</label>`;h+=tx('Lines (one per line)',()=>s.l.join('\n'),v=>s.l=v.split('\n').map(x=>x.trim()).filter(Boolean),5)});
 const en=C.envelope;h+='<h4>Sealed envelope</h4>'+tx('Small label',()=>en.k,v=>en.k=v)+tx('Instruction under envelope',()=>en.h,v=>en.h=v)+tx('Message inside (one paragraph per line)',()=>en.msg,v=>en.msg=v,9)+tx('Button text',()=>en.btn,v=>en.btn=v);
 h+='<h4>Wish scene</h4>'+[['k','Small label'],['t','Title'],['h','Instruction'],['f1','Final big text'],['f2','Final message']].map(a=>tx(a[1],()=>C.wish[a[0]],v=>C.wish[a[0]]=v)).join('');
 h+='<h4>Credits</h4>'+tx('Credits title',()=>C.credits.title,v=>C.credits.title=v)+tx('Rows (Label | Text, one per line)',()=>C.credits.rows.map(r=>r.join(' | ')).join('\n'),v=>C.credits.rows=v.split('\n').filter(x=>x.trim()).map(x=>{const p=x.split('|');return [p[0].trim(),(p.slice(1).join('|')||'').trim()]}),6)+tx('Last line',()=>C.credits.end,v=>C.credits.end=v);
 h+=`<h4>Song</h4><label>Upload your song (mp3, under 8 MB) ${C.music?'✓ added':'(using built-in piano)'}<input type="file" accept="audio/*" id="song"></label><label><input type="checkbox" id="songclr"> Use the built-in piano music instead</label>`;
 const m=document.createElement('div');m.id='edm';m.innerHTML=`<div class="p"><h3>Edit your film ✏️</h3><p style="color:#bfa59b;margin:0">Change anything, then save. Everyone who opens the link will see the new version.</p>${h}<div class="row"><button class="btn" id="sv" onclick="saveEd()">Save</button><button class="btn" style="background:#3a2430;color:#f3dcaa;box-shadow:none" onclick="document.getElementById('edm').remove()">Cancel</button></div><p id="edmsg" style="color:#f3dcaa"></p></div>`;
 document.body.appendChild(m);
}
async function saveEd(){
 const msg=$('edmsg'),btn=$('sv');btn.disabled=true;msg.textContent='Saving...';
 try{
  document.querySelectorAll('#edm [data-i]').forEach(el=>FL[+el.dataset.i].set(el.value));
  for(let n=0;n<C.scenes.length;n++){const cl=$('scimgclr'+n);if(cl&&cl.checked)delete C.scenes[n].img;const fi=$('scimg'+n),f=fi&&fi.files[0];if(f)C.scenes[n].img=await shrink(f)}
  if($('songclr').checked)C.music='';
  const sf=$('song').files[0];if(sf){if(sf.size>8e6){msg.textContent='Song is too big (max 8 MB).';btn.disabled=false;return}C.music=await rdAudio(sf)}
  const d=document.documentElement.cloneNode(true);
  d.querySelector('#cfg').textContent=JSON.stringify(C).replace(/</g,'\\u003c');
  ['#sc','#bgwrap','#prog','#hint'].forEach(q=>d.querySelector(q).innerHTML='');
  d.querySelector('#sc').className='';d.querySelectorAll('canvas:not(#bk)').forEach(c=>c.remove());
  const eb=d.querySelector('#edm');if(eb)eb.remove();['#mute','#edbtn'].forEach(q=>d.querySelector(q).removeAttribute('style'));
  ['width','height'].forEach(a=>d.querySelector('#bk').removeAttribute(a));
  await ART.publish('<!DOCTYPE html>\n'+d.outerHTML);
 }catch(x){msg.textContent='Could not save: '+((x&&x.message)||x&&x.code||'try again');btn.disabled=false}
}
play(0);
</script>
